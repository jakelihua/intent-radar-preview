name: Validate pilot
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m unittest test_suite test_regressions -v
      - run: python main.py --demo && cp report.html index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
