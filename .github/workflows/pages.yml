name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Isolated Public Pages Bundle
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp report.html _site/report.html
          cp .nojekyll _site/.nojekyll
          # Explicitly forbid any internal playbook or state DB from ever entering public Pages artifact
          rm -f _site/internal_bd_ops.html _site/*.sqlite3
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
