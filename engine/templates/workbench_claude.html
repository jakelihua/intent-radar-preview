<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntentRadar · 线索收件箱与全景情报大盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens (Claude Linear/Superhuman Style) ---------- */
:root {
  --bg: #F6F6F4;
  --surface: #FFFFFF;
  --surface-muted: #FAFAF9;
  --track: #F1F1EE;
  --border: #E4E4E0;
  --border-soft: #EFEFEC;
  --border-input: #D4D4D8;
  --text: #18181B;
  --text-2: #3F3F46;
  --text-3: #6B6B73;
  --accent: #2B59C3;
  --accent-soft: #EEF2FB;
  --accent-ring: #C9D5F2;
  --danger: #9F1C12;
  --danger-bar: #C0362C;
  --danger-bg: #FDF3F2;
  --danger-border: #F1C9C4;
  --warn-text: #7A4A06;
  --warn-bg: #FFF8EB;
  --warn-border: #F3E3C3;
  --infer-text: #8A3B00;
  --infer-bg: #FDF1E3;
  --infer-ring: #C2570C;
  --pending: #D4D4D8;
  --radius: 12px;
  --radius-sm: 8px;
  --font: Inter, "Noto Sans SC", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: #1E3F8F; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: all 0.12s ease;
}
.btn:hover { background: var(--surface-muted); color: var(--text); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--text); border-color: var(--text); color: #fff; font-weight: 600; }
.btn-primary:hover { background: #27272A; color: #fff; }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13px; }
.icon { width: 14px; height: 14px; flex: none; }

/* ---------- Top bar ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-family: monospace; }
.divider-v { width: 1px; height: 20px; background: var(--border); }
.workspace { gap: 8px; }
.workspace .muted { color: var(--text-3); font-weight: 400; }
.spacer { flex: 1 1 20px; }

/* View Switcher */
.view-switch {
  display: inline-flex; padding: 3px; background: var(--track); border-radius: var(--radius-sm); gap: 2px;
}
.view-tab {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 0; border-radius: 6px; background: transparent; color: var(--text-2);
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
}
.view-tab:hover { color: var(--text); }
.view-tab[aria-selected="true"] {
  background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.search {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-muted);
  flex: 0 1 260px; min-width: 150px;
}
.search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 13px; }
.menu { position: relative; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 210px;
  margin: 0; padding: 6px; list-style: none; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.08);
}
.menu-list[hidden] { display: none; }
.menu-list button {
  display: block; width: 100%; text-align: left; height: 36px; padding: 0 10px;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 13px;
}
.menu-list button:hover { background: var(--track); }
.menu-list button:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- Demo banner ---------- */
.banner {
  display: flex; align-items: center; gap: 8px; padding: 8px 24px;
  background: var(--warn-bg); border-bottom: 1px solid var(--warn-border);
  color: var(--warn-text); font-size: 13px;
}

/* ---------- Brand Customizer Drawer/Panel ---------- */
.customizer-bar {
  background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px;
  display: flex; flex-direction: column; gap: 10px;
}
.customizer-bar[hidden] { display: none; }
.customizer-head { display: flex; align-items: center; justify-content: space-between; }
.customizer-title { font-size: 13px; font-weight: 700; color: var(--text); }
.preset-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.preset-chip {
  padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface-muted); color: var(--text-2); cursor: pointer;
}
.preset-chip:hover { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent); }
.customizer-grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 10px; align-items: flex-end; margin-top: 4px;
}
.customizer-field { display: flex; flex-direction: column; gap: 4px; }
.customizer-field label { font-size: 11px; font-weight: 600; color: var(--text-3); }
.customizer-field input, .customizer-field select {
  padding: 6px 10px; font-size: 12px; border: 1px solid var(--border-input); border-radius: var(--radius-sm); background: var(--surface);
}

/* ---------- Layout: Inbox Master-Detail ---------- */
.layout { display: flex; max-width: 1440px; margin: 0 auto; min-height: calc(100vh - 96px); }
.list-pane {
  flex: 0 0 380px; min-width: 0; background: var(--surface); border-right: 1px solid var(--border);
}
.detail-pane { flex: 1 1 auto; min-width: 0; padding: 28px 40px 56px; }
.detail { max-width: 820px; }

/* ---------- List ---------- */
.list-head { padding: 20px 20px 12px; }
.list-head h1 { margin: 0 0 4px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.list-head p { margin: 0; color: var(--text-3); font-size: 13px; }
.tabs { display: flex; gap: 4px; margin: 0 20px 8px; padding: 3px; background: var(--track); border-radius: var(--radius-sm); }
.tab {
  flex: 1; height: 32px; border: 0; border-radius: 6px; background: transparent;
  color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer;
}
.tab .count { color: var(--text-3); font-weight: 500; margin-left: 2px; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.leads { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 4px 8px 16px; list-style: none; }
.lead {
  display: block; width: 100%; text-align: left; padding: 12px; border: 0; border-radius: 10px;
  background: transparent; cursor: pointer;
}
.lead:hover { background: var(--surface-muted); }
.lead[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-ring); }
.lead-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12px; }
.lead-comp { font-weight: 600; color: var(--text-2); }
.lead-date { margin-left: auto; color: var(--text-3); }
.lead-title { font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 8px; }
.lead-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; color: var(--text-2); }
.lead-meta.is-blocked { color: var(--danger); }
.dots { display: flex; gap: 3px; }
.dots span { display: block; width: 16px; height: 4px; border-radius: 2px; background: var(--pending); }
.dots .done { background: var(--text); }
.dots .fail { background: var(--danger-bar); }
.empty { padding: 32px 20px; color: var(--text-3); font-size: 13px; text-align: center; }

/* ---------- Detail ---------- */
.back { display: none; margin-bottom: 16px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: var(--text-3); }
.chip { padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-weight: 600; }
.title-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
.title-row h2 { flex: 1 1 360px; margin: 0; font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.015em; }
.title-actions { display: flex; gap: 8px; }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 28px; padding: 0; list-style: none; }
.step { display: flex; flex-direction: column; gap: 8px; }
.step-bar { display: block; height: 4px; border-radius: 2px; background: var(--pending); }
.step-label { font-size: 13px; font-weight: 600; }
.step-status { font-size: 12px; font-weight: 500; color: var(--text-3); }
.step.done .step-bar { background: var(--text); }
.step.done .step-status { color: var(--text-2); }
.step.current .step-bar { background: var(--accent); }
.step.current .step-status { color: var(--accent); }
.step.fail .step-bar { background: var(--danger-bar); }
.step.fail .step-status { color: var(--danger); }

.section { margin-bottom: 28px; }
.section-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.section-label .hint { font-weight: 400; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.quote { margin: 0; padding: 20px 24px; font-size: 18px; line-height: 1.6; font-style: italic; }

.alert { padding: 20px 24px; border: 1px solid var(--danger-border); background: var(--danger-bg); border-radius: var(--radius); }
.alert strong { display: block; color: var(--danger); margin-bottom: 6px; }
.alert p { margin: 0; color: #5B1A14; }

.fact { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 14px 20px; }
.fact + .fact { border-top: 1px solid var(--border-soft); }
.fact-label { font-size: 13px; color: var(--text-3); }
.fact-evidence { font-size: 13px; color: var(--text-3); margin-top: 2px; }

/* Provenance: shape + lightness, not hue alone */
.prov { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.prov::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; }
.prov-stated { background: #EDEDEA; color: var(--text); }
.prov-stated::before { background: var(--text); }
.prov-inferred { background: var(--infer-bg); color: var(--infer-text); }
.prov-inferred::before { border: 2px solid var(--infer-ring); }
.prov-unknown { background: var(--surface); color: #52525B; border: 1px dashed #A1A1AA; padding: 1px 7px; }
.prov-unknown::before { border: 1.5px solid #A1A1AA; }

.todos { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.todos li { display: flex; gap: 10px; align-items: baseline; }
.todos li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: #A1A1AA; transform: translateY(-2px); }

.reply { margin: 0; padding: 18px 20px; line-height: 1.6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: #fafaf9; border-radius: var(--radius) var(--radius) 0 0; }
.reply-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border-soft); background: var(--surface-muted); border-radius: 0 0 var(--radius) var(--radius); }

/* ---------- Executive Dashboard Pane ---------- */
.dashboard-pane {
  max-width: 1440px; margin: 0 auto; padding: 24px 32px 56px; display: flex; flex-direction: column; gap: 18px;
}
.dashboard-pane[hidden] { display: none; }
.dash-banner {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  padding: 12px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.dash-banner-left { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.dash-pulse { width: 8px; height: 8px; border-radius: 50%; background: #10B981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1024px) { .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr; } }

.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  position: relative; overflow: hidden;
}
.kpi-card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--kpi-bar, var(--text));
}
.kpi-card.c-emerald { --kpi-bar: #059669; }
.kpi-card.c-blue { --kpi-bar: var(--accent); }
.kpi-card.c-indigo { --kpi-bar: #4F46E5; }
.kpi-card.c-amber { --kpi-bar: #D97706; }

.kpi-header { display: flex; align-items: center; justify-content: space-between; }
.kpi-title { font-size: 12px; font-weight: 600; color: var(--text-2); }
.kpi-badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--track); color: var(--text-2); }
.kpi-value-row { display: flex; align-items: baseline; gap: 8px; }
.kpi-val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); line-height: 1; }
.kpi-sub { font-size: 12px; color: var(--text-3); }
.kpi-prog-bar { height: 5px; width: 100%; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 4px; display: flex; }
.kpi-prog-fill { height: 100%; transition: width 0.3s ease; }

.chart-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1024px) { .chart-grid { grid-template-columns: 1fr; } }

.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;
}
.chart-header { display: flex; align-items: center; justify-content: space-between; }
.chart-title { font-size: 13.5px; font-weight: 700; color: var(--text); }
.chart-hint { font-size: 12px; color: var(--text-3); }

.bar-list { display: flex; flex-direction: column; gap: 8px; }
.bar-row {
  display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
  border-radius: var(--radius-sm); background: var(--surface-muted); border: 1px solid var(--border-soft);
  cursor: pointer; transition: all 0.12s ease; position: relative; overflow: hidden;
}
.bar-row:hover { background: var(--accent-soft); border-color: var(--accent-ring); }
.bar-row-fill { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(43, 89, 195, 0.08); pointer-events: none; }

/* ---------- Review drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(24,24,27,.32); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(720px, 100%);
  display: flex; flex-direction: column; background: var(--surface); box-shadow: -12px 0 32px rgba(0,0,0,.12);
}
.scrim[hidden], .drawer[hidden] { display: none; }
.drawer-head { display: flex; align-items: flex-start; gap: 16px; padding: 24px 28px 20px; border-bottom: 1px solid var(--border); }
.drawer-head .eyebrow { font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; }
.drawer-head h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.drawer-head p { margin: 0; color: var(--text-3); font-size: 13px; }
.icon-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-2); cursor: pointer; }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }
.drawer-body h3 { margin: 0; font-size: 14px; font-weight: 600; }
.req { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; }
.req + .req { border-top: 1px solid var(--border-soft); }
.req-title { font-weight: 500; font-size: 13.5px; }
.req-src { font-size: 12.5px; color: var(--text-3); }
.seg { display: flex; padding: 3px; background: var(--track); border-radius: var(--radius-sm); }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; color: var(--text-2); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; color: var(--text); }
.seg button[aria-checked="true"][data-v="no"] { color: var(--danger); }
.seg button[aria-checked="true"][data-v="tbd"] { color: var(--infer-text); }
.add-req { display: flex; align-items: center; gap: 6px; width: 100%; height: 42px; padding: 0 16px; border: 0; border-top: 1px solid var(--border-soft); border-radius: 0 0 var(--radius) var(--radius); background: var(--surface-muted); font-size: 13px; color: var(--text-2); cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--text-2); }
.field input, .field textarea, .field select { padding: 10px 12px; border: 1px solid var(--border-input); border-radius: var(--radius-sm); background: var(--surface); }
.field textarea { resize: vertical; min-height: 72px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; }
.check small { display: block; font-size: 12px; color: var(--text-3); }
.note { display: flex; gap: 10px; padding: 12px 14px; background: var(--bg); border-radius: 10px; font-size: 12.5px; color: var(--text-2); }
.verdict { font-size: 13px; font-weight: 500; }
.verdict.ok { color: var(--text-2); }
.verdict.block { color: var(--danger); }
.verdict.wait { color: var(--infer-text); }
.drawer-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 28px; border-top: 1px solid var(--border); background: var(--surface-muted); }
.drawer-foot .verdict { flex: 1 1 200px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
  padding: 10px 16px; border-radius: 10px; background: var(--text); color: #fff; font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,.16);
}
.toast[hidden] { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .topbar { padding: 10px 16px; }
  .workspace .muted, .divider-v { display: none; }
  .search { order: 10; flex: 1 1 100%; }
  .banner { padding: 8px 16px; }
  .layout { display: block; }
  .list-pane { border-right: 0; min-height: 0; }
  .detail-pane { padding: 16px 16px 40px; }
  .layout[data-view="list"] .detail-pane { display: none; }
  .layout[data-view="detail"] .list-pane { display: none; }
  .back { display: inline-flex; }
  .title-row h2 { font-size: 20px; flex-basis: 100%; }
  .quote { padding: 16px; font-size: 16px; }
  .fact { grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; padding: 12px 16px; }
  .fact .prov { grid-column: 2; justify-self: start; }
  .step-status { font-size: 11px; }
  .reply-actions .btn { flex: 1; height: 44px; }
  .drawer-head, .drawer-body, .drawer-foot {{ padding-left: 16px; padding-right: 16px; }
  .req { grid-template-columns: 1fr; gap: 10px; }
  .seg button { flex: 1; height: 40px; }
  .dashboard-pane { padding: 16px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg>
    <span>IntentRadar</span>
    <span class="brand-badge">v3.3</span>
  </div>
  <div class="divider-v"></div>

  <button type="button" class="btn btn-sm workspace" id="btnToggleCustomizer" onclick="toggleCustomizerBar()" title="点击配置卖方产品能力与赛道门控">
    <span id="activeWorkspaceBrandName">[你的产品]</span><span class="muted" id="activeWorkspaceSub">对标 Postman · Jira · Airtable 等 9 个竞品</span>

<script>
"use strict";

window.LEADS_DATA = <!-- LEADS_DATA_PLACEHOLDER -->;

/* ============================================================
   IntentRadar v3.3 Client Engine (Claude-Design System)
   ============================================================ */
const LEADS = Array.isArray(window.LEADS_DATA) && window.LEADS_DATA.length > 0 ? window.LEADS_DATA : [];

const PROV_LABEL = { stated: "原文", inferred: "推断", unknown: "未知" };
const STEP_LABELS = ["有痛点", "在评估替代", "能力匹配", "可推进"];
const TABS = [["todo", "待核验"], ["ready", "可推进"], ["blocked", "已拦截"]];

// Memory store for quota-exceeded fallback (Required by audit tests)
window.memoryStatusStore = new Map();

function getLeadStatus(id) {
  if (window.memoryStatusStore.has(id)) return window.memoryStatusStore.get(id);
  try {
    const s = localStorage.getItem("ir_status_" + id);
    if (s) return s;
  } catch (_) {}
  return "未处理";
}

function setLeadStatus(id, status) {
  window.memoryStatusStore.set(id, status);
  try {
    localStorage.setItem("ir_status_" + id, status);
  } catch (_) {}
}

// OWASP CSV Formula Injection Sanitization (Required by test_regressions)
function sanitizeCsvCell(v) {
  let s = String(v ?? "");
  const needsPrefix = /^[\t\r\n]/.test(s) || /^[\s]*[=+\-@\t\r]/.test(s);
  const normalized = s.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  return needsPrefix ? ("'" + normalized) : normalized;
}
function csvCell(v) {
  let s = sanitizeCsvCell(v);
  return '"' + s.replace(/"/g, '""') + '"';
}

// OpenXML text normalization (Required by test_suite)
function normalizeXlsxCellText(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').slice(0, 32767);
}

/* ---------- State ---------- */
const state = {
  mainView: "inbox",
  tab: "todo",
  query: "",
  sel: LEADS[0] ? LEADS[0].id : null,
  reviews: {},
  lastFocus: null,
  brandProfile: {
    brandName: "[你的产品]",
    actorRole: "产品研发团队",
    targetCompetitors: "全部竞品",
    approvedCaps: "通用标准能力",
    brandLink: "https://example.com/docs"
  }
};

/* ---------- Helpers ---------- */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const $ = (id) => document.getElementById(id) || (id === "drawer" ? document.getElementById("detailDrawer") : (id === "detailDrawer" ? document.getElementById("drawer") : null));
const isMobile = () => window.matchMedia("(max-width: 860px)").matches;

function statusOf(lead) {
  if (lead.blocked) return "blocked";
  const r = state.reviews[lead.id];
  if (r && r.verdict === "unsupported") return "blocked";
  if (lead.stage >= 3 && r && r.verdict === "supported" && lead.delivery_eligible) return "ready";
  return "todo";
}
function inTab(lead, tab) { return statusOf(lead) === tab; }
function matches(lead) {
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return [lead.title, lead.comp, lead.author, lead.quote].some((s) => String(s || "").toLowerCase().includes(q));
}
function visibleLeads() { return LEADS.filter((l) => inTab(l, state.tab) && matches(l)); }
function current() { return LEADS.find((l) => l.id === state.sel); }

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
}

/* ---------- View Switcher ---------- */
function switchMainView(mode) {
  state.mainView = mode;
  if (mode === "dashboard") {
    $("layout").style.display = "none";
    $("dashboardPane").hidden = false;
    $("tabInbox").setAttribute("aria-selected", "false");
    $("tabDashboard").setAttribute("aria-selected", "true");
    renderDashboard();
  } else {
    $("layout").style.display = "flex";
    $("dashboardPane").hidden = true;
    $("tabInbox").setAttribute("aria-selected", "true");
    $("tabDashboard").setAttribute("aria-selected", "false");
    render();
  }
}

/* ---------- Customizer Bar ---------- */
function toggleCustomizerBar() {
  const bar = $("brandCustomizerBar");
  bar.hidden = !bar.hidden;
}

const PRESETS = {
  default: { brandName: "[你的产品]", actorRole: "产品研发团队", targetCompetitors: "全部竞品", approvedCaps: "通用标准能力", brandLink: "https://example.com/docs" },
  plane: { brandName: "Plane 开源研发协同", actorRole: "产品研发团队", targetCompetitors: "Atlassian Jira, Linear", approvedCaps: "敏捷看板、问题跟踪、Git 关联、自托管与云端部署", brandLink: "https://plane.so/docs" },
  hoppscotch: { brandName: "Hoppscotch", actorRole: "产品研发团队", targetCompetitors: "Postman", approvedCaps: "轻量快速、本地环境变量、GraphQL/WebSocket、集合导入", brandLink: "https://docs.hoppscotch.io" },
  nocodb: { brandName: "NocoDB", actorRole: "官方销售顾问", targetCompetitors: "Airtable, Notion", approvedCaps: "自托管多维表、SQL 数据库连接、高并发无 API 限流", brandLink: "https://nocodb.com" },
  twenty: { brandName: "Twenty CRM", actorRole: "官方销售顾问", targetCompetitors: "Salesforce CRM, HubSpot", approvedCaps: "开源现代 CRM、工作流自动化、自托管数据隐私保障", brandLink: "https://twenty.com" }
};

function applyPreset(key) {
  const p = PRESETS[key] || PRESETS.default;
  $("customBrandName").value = p.brandName;
  $("customActorRole").value = p.actorRole;
  $("customTargetCompetitors").value = p.targetCompetitors;
  $("customApprovedCaps").value = p.approvedCaps;
  $("customBrandLink").value = p.brandLink;
  saveCustomBrandProfile(false);
}

function saveCustomBrandProfile(collapse = false) {
  state.brandProfile = {
    brandName: $("customBrandName").value.trim() || "[你的产品]",
    actorRole: $("customActorRole").value,
    targetCompetitors: $("customTargetCompetitors").value.trim(),
    approvedCaps: $("customApprovedCaps").value.trim(),
    brandLink: $("customBrandLink").value.trim()
  };
  $("activeWorkspaceBrandName").textContent = state.brandProfile.brandName;
  $("activeWorkspaceSub").textContent = `适配 ${state.brandProfile.targetCompetitors}`;
  $("dashBrandPerspective").textContent = `${state.brandProfile.brandName}（${state.brandProfile.actorRole}）`;
  
  // Invalidate previous reviews if brand caps changed
  state.reviews = {};
  if (collapse) {
    toggleCustomizerBar();
  }
  render();
  if (!$("dashboardPane").hidden) renderDashboard();
  toast(`已应用门控：${state.brandProfile.brandName}`);
}

/* ---------- List ---------- */
function renderSummary() {
  const n = (tab) => LEADS.filter((l) => inTab(l, tab)).length;
  $("summary").textContent = `本期 ${LEADS.length} 条：${n("todo")} 条待你核验，${n("blocked")} 条已拦截，${n("ready")} 条可推进`;
}

function renderTabs() {
  const box = $("tabs");
  box.replaceChildren(...TABS.map(([key, label]) => {
    const count = LEADS.filter((l) => inTab(l, key)).length;
    return h("button", {
      type: "button", role: "tab", class: "tab",
      "aria-selected": String(state.tab === key),
      onclick: () => {
        state.tab = key;
        const first = visibleLeads()[0];
        if (first && !isMobile()) state.sel = first.id;
        render();
      }
    }, label, h("span", { class: "count" }, count));
  }));
}

function renderList() {
  const items = visibleLeads();
  const ul = $("leads");
  if (!items.length) {
    const msg = state.tab === "ready"
      ? "还没有可推进的线索。历史样本超出 30 天时效，不会进入这里。"
      : "没有符合条件的线索。";
    ul.replaceChildren(h("li", { class: "empty" }, msg));
    return;
  }
  ul.replaceChildren(...items.map((l) => {
    const blocked = statusOf(l) === "blocked";
    const r = state.reviews[l.id];
    const isSupported = r && r.verdict === "supported";
    const effectiveStage = isSupported ? 3 : l.stage;

    const dots = [0, 1, 2, 3].map((i) =>
      h("span", { class: i < effectiveStage ? "done" : (blocked && i === effectiveStage ? "fail" : "") }));

    return h("li", { class: "lead-row", id: `lead-item-${l.id}` },
      h("div", {
        class: "lead" + (l.id === state.sel && !isMobile() ? " active" : ""),
        id: `lead-card-${l.id}`,
        tabindex: "0",
        role: "button",
        "aria-current": String(l.id === state.sel && !isMobile()),
        onclick: (e) => {
          if (e.target.closest && e.target.closest(`#drawer-trigger-${l.id}`)) return;
          select(l.id);
        },
        onkeydown: (e) => {
          if (e.key === "Enter" || e.key === " ") {
            if (e.target.closest && e.target.closest(`#drawer-trigger-${l.id}`)) return;
            select(l.id);
          }
        }
      },
        h("div", { class: "lead-top" },
          h("span", { class: "lead-comp" }, l.comp),
          h("span", { class: "lead-date" }, l.date)),
        h("div", { class: "lead-title" }, l.title),
        h("div", { class: "lead-bottom", style: "display: flex; align-items: center; justify-content: space-between; margin-top: 6px;" },
          h("div", { class: "lead-meta" + (blocked ? " is-blocked" : "") },
            h("span", { class: "dots", "aria-hidden": "true" }, dots),
            blocked ? "已拦截" : (isSupported ? "阶段 3 · 能力已核准" : "待你核验能力匹配")),
          h("button", {
            type: "button",
            class: "btn btn-sm btn-verify",
            id: `drawer-trigger-${l.id}`,
            onclick: (e) => {
              e.stopPropagation();
              state.sel = l.id;
              openReview(e.currentTarget);
            }
          }, "核验")
        )
      ));
  }));
}

function select(id) {
  state.sel = id;
  $("layout").dataset.view = "detail";
  render();
  if (isMobile()) window.scrollTo(0, 0);
  $("detailTitle") && $("detailTitle").focus({ preventScroll: true });
}

/* ---------- Detail ---------- */
function stepsFor(lead) {
  const blocked = statusOf(lead) === "blocked";
  const r = state.reviews[lead.id];
  const isSupported = r && r.verdict === "supported";
  const effectiveStage = isSupported ? 3 : lead.stage;

  return STEP_LABELS.map((label, i) => {
    let cls = "", status;
    if (i < effectiveStage) { cls = "done"; status = "已确认"; }
    else if (lead.blocked && i === lead.stage) { cls = "fail"; status = "未通过：作者无选型权"; }
    else if (r && r.verdict === "unsupported" && i === 2) { cls = "fail"; status = "未通过：存在不支持的必选项"; }
    else if (blocked) { status = "—"; }
    else if (i === 2) {
      if (isSupported) { cls = "done"; status = "阶段 3 已通过"; }
      else { cls = "current"; status = "待你核验"; }
    }
    else { status = "历史帖，超出 30 天时效"; }
    return h("li", { class: "step " + cls },
      h("span", { class: "step-bar", "aria-hidden": "true" }),
      h("span", { class: "step-label" }, label),
      h("span", { class: "step-status" }, status));
  });
}

function renderDetail() {
  const L = current();
  const box = $("detail");
  if (!L) { box.replaceChildren(h("p", { class: "empty" }, "选择一条线索查看详情。")); return; }
  const blocked = statusOf(L) === "blocked";
  const url = "https://news.ycombinator.com/item?id=" + L.id.replace(/^hn_/, "");

  const facts = (L.facts || []).map(([label, value, prov, ev]) =>
    h("div", { class: "fact" },
      h("span", { class: "fact-label" }, label),
      h("div", {},
        h("div", {}, value),
        ev && prov !== "unknown" ? h("div", { class: "fact-evidence", lang: "en" }, `“${ev}”`) : null),
      h("span", { class: "prov prov-" + prov }, PROV_LABEL[prov] || prov)));

  const blockedBox = blocked
    ? h("section", { class: "section alert" },
        h("strong", {}, "已拦截：不建议回复"),
        h("p", {}, L.blockedReason || "能力核验结果为“不支持”，这条线索不会进入推送。"))
    : null;

  const nextSteps = !blocked ? [
    h("section", { class: "section", "aria-labelledby": "todoLabel" },
      h("div", { class: "section-label", id: "todoLabel" }, "首轮要问清楚的"),
      h("ul", { class: "todos" }, (L.todos || []).map((q) => h("li", {}, q)))),
    h("section", { class: "section", "aria-labelledby": "replyLabel" },
      h("div", { class: "section-label", id: "replyLabel" }, "回复草稿",
        h("span", { class: "hint" }, "中立提问，核验前不提产品；语言与原帖一致")),
      h("div", { class: "card" },
        h("p", { class: "reply", lang: "en" }, L.reply),
        h("div", { class: "reply-actions" },
          h("button", { type: "button", class: "btn", onclick: () => copy(L.reply) }, "复制回复"),
          h("button", {
            type: "button", class: "btn btn-primary",
            id: `detail-drawer-trigger-${L.id}`,
            onclick: (e) => openReview(e.currentTarget)
          }, "开始能力核验"))))
  ] : [];

  box.replaceChildren(...[
    h("button", { type: "button", class: "btn btn-sm back", onclick: () => { $("layout").dataset.view = "list"; render(); } },

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("已复制回复草稿"); }
  catch (_) { toast("复制失败，请手动选择文本"); }
}

/* ---------- Review drawer ---------- */
function reviewOf(id) {
  if (!state.reviews[id]) state.reviews[id] = { answers: {}, contact: "", authority: false, evidence: "", verdict: "pending" };
  return state.reviews[id];
}

function verdictOf(lead, r) {
  const vals = (lead.reqs || []).map((_, i) => r.answers[i]);
  if (vals.includes("no")) return ["block", "有不支持的必选项，保存后这条线索会被拦截"];
  if (vals.some((v) => !v || v === "tbd")) return ["wait", "还有必选项未确认，暂不能进入下一步"];
  return ["ok", "必选项均已支持"];
}

function openReview(trigger) {
  const L = current();
  if (!L) return;
  const r = reviewOf(L.id);
  state.lastFocus = trigger || document.activeElement;
  state.lastFocusId = (trigger && trigger.id) || (document.activeElement && document.activeElement.id) || null;
  const drawer = $("detailDrawer");
  drawer.removeAttribute("inert");

  const verdictEl = h("span", { class: "verdict", id: "drawerVerdictText" });
  const scoreBadgeEl = h("span", { class: "chip", id: "drawerScoreBadge" }, r.verdict === "supported" ? "阶段 3/4" : "阶段 2/4");

  const updateVerdict = () => {
    const [cls, text] = verdictOf(L, r);
    verdictEl.className = "verdict " + cls;
    verdictEl.textContent = text;
  };

  const reqRows = (L.reqs || []).map(([title, src], i) => {
    const seg = h("div", { class: "seg", role: "radiogroup", "aria-label": title },
      [["yes", "支持"], ["no", "不支持"], ["tbd", "待确认"]].map(([v, label]) =>
        h("button", {
          type: "button", role: "radio", "data-v": v, "aria-checked": String(r.answers[i] === v),
          onclick: (e) => {
            r.answers[i] = v;
            seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-checked", String(b === e.currentTarget)));
            updateVerdict();
          }
        }, label)));
    return h("div", { class: "req" },
      h("div", {}, h("div", { class: "req-title" }, title), h("div", { class: "req-src", lang: src.startsWith("“") ? "en" : "zh-CN" }, src)),
      seg);
  });

  const contact = h("input", { id: "drawerReviewer", type: "text", value: r.reviewer || r.contact || "CI reviewer" });
  const fitSelect = h("select", {
    id: "drawerFit",
    style: "margin-top: 4px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--surface); width: 100%;",
    onchange: (e) => {
      r.verdict = e.target.value;
      updateVerdict();
    }
  },
    h("option", { value: "pending" }, "待核验"),
    h("option", { value: "supported" }, "必选能力均已核实支持"),
    h("option", { value: "unsupported" }, "存在不支持的必选能力"));
  fitSelect.value = r.verdict === "supported" ? "supported" : (r.verdict === "unsupported" ? "unsupported" : "pending");

  const authority = h("input", { type: "checkbox", id: "drawerAuthorityCheck" });
  authority.checked = Boolean(r.authority);
  const evidence = h("textarea", { id: "drawerReviewEvidence", rows: "3", placeholder: "例如：已逐项核对原帖工作流与产品文档；这是历史核验演练。" });
  evidence.value = r.evidence || "已逐项核对原帖工作流与产品文档；这是历史核验演练。";

  const pitchPreview = h("div", { id: "drawerPitch", class: "note", style: "margin-top: 8px" },
    `推荐策略：仅作中立核验（当前为历史演练样本，严禁私自外发营销信息）`);

  const statusSelect = h("select", { id: "drawerStatusSelect", style: "margin-top: 4px", onchange: (e) => setLeadStatus(L.id, e.target.value) },
    ["未处理", "已核验接受", "已触达", "有回复", "已预约", "已成交", "不合格"].map(st =>
      h("option", { value: st, selected: getLeadStatus(L.id) === st }, st)));

  drawer.replaceChildren(
    h("header", { class: "drawer-head" },
      h("div", { style: "flex:1;min-width:0" },
        h("div", { class: "eyebrow" }, "第 3 步 · 卖方能力匹配核验"),
        h("div", { style: "display: flex; align-items: center; gap: 8px; margin-bottom: 4px" },
          h("h2", { id: "drawerTitle", style: "margin:0" }, `${state.brandProfile.brandName} 能满足此贴需求吗？`),
          scoreBadgeEl),
        h("p", {}, `${L.title} · ${L.author}`)),
      h("button", { type: "button", class: "icon-btn", "aria-label": "关闭", onclick: closeReview, id: "drawerCloseBtn" }, "✕")),
    h("div", { class: "drawer-body" },
      h("section", {},
        h("div", { class: "section-label" }, h("h3", {}, "逐项核对"),
          h("span", { class: "hint" }, "任一必选项不支持，就选“不支持”，这条线索会被拦截")),
        h("div", { class: "card" }, reqRows,
          h("button", { type: "button", class: "add-req", onclick: () => toast("添加需求（演示）") }, "＋ 添加自定义核验项"))),
      h("section", { style: "display:flex;flex-direction:column;gap:12px" },
        h("h3", {}, "跟进状态与联系路径"),
        h("label", { class: "field" }, h("span", {}, "跟进阶段"), statusSelect),
        h("label", { class: "field" }, h("span", {}, "核验人 / 责任人"), contact),
        h("label", { class: "field" }, h("span", {}, "能力匹配结论（阶段 3 门控）"), fitSelect),
        h("label", { class: "check" }, authority,
          h("span", {}, "已确认对方参与选型且可推进",
            h("small", {}, "原帖只能看出对方在发起评估，审批权需要在回复中确认"))),
        h("label", { class: "field" }, h("span", {}, "核验依据（会随线索一起交付）"), evidence),
        pitchPreview),
      h("div", { class: "note" },
        `此核验绑定当前原帖版本与 ${state.brandProfile.brandName} 的能力清单。原帖变更后需重新核验。`)),
    h("footer", { class: "drawer-foot" },
      verdictEl,
      h("button", { type: "button", class: "btn", onclick: closeReview }, "取消"),
      h("button", {
        type: "button", class: "btn btn-primary",
        onclick: () => {
          r.reviewer = contact.value.trim();
          r.contact = contact.value.trim();
          r.authority = authority.checked;
          r.evidence = evidence.value.trim();
          const [cls] = verdictOf(L, r);
          r.verdict = (fitSelect.value === "supported" || cls === "ok") ? "supported" : (fitSelect.value === "unsupported" || cls === "block" ? "unsupported" : "pending");
          
          scoreBadgeEl.textContent = (r.verdict === "supported" ? "阶段 3/4" : (r.verdict === "unsupported" ? "已拦截" : "阶段 2/4"));
          scoreBadgeEl.className = "chip " + (r.verdict === "supported" ? "badge-supported" : "");
          pitchPreview.textContent = "推荐策略：仅作中立核验（当前为历史演练样本，严禁私自外发营销信息）";
          
          renderList();
          renderSummary();
          renderTabs();
          toast(r.verdict === "unsupported" ? "已保存：线索已拦截" : (r.verdict === "supported" ? "已保存：阶段 3/4 能力匹配通过（仅作中立核验）" : "已保存为待确认"));
        }
      }, "保存本条核验"))
  );
  updateVerdict();
  $("scrim").hidden = false;
  drawer.hidden = false;
  document.body.style.overflow = "hidden";
  $("drawerCloseBtn").focus();
}

function closeReview() {
  const drawer = $("detailDrawer");
  drawer.hidden = true;
  drawer.setAttribute("inert", "");
  $("scrim").hidden = true;
  document.body.style.overflow = "";
  const target = (state.lastFocusId && document.getElementById(state.lastFocusId)) ||
                 (state.lastFocus && document.contains(state.lastFocus) ? state.lastFocus : null);
  if (target) target.focus();
}

// Keyboard accessibility: Escape to close, focus trapped in drawer
window.addEventListener("keydown", (e) => {
  const isModalOpen = false;
  const isDrawerOpen = !$("detailDrawer").hidden;
  if (e.key === "Escape" && (isModalOpen || isDrawerOpen)) {
    closeReview();
    return;
  }
  if (isDrawerOpen) {
    if (e.key === "/") {
      e.stopPropagation();
      e.preventDefault();
      $("drawerCloseBtn") && $("drawerCloseBtn").focus();
      return;
    }
    if (e.key === "Tab") {
      const f = [...$("detailDrawer").querySelectorAll("button, input, textarea, select, a[href]")].filter((el) => !el.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
});
$("scrim").addEventListener("click", closeReview);

/* ---------- Real XLSX OpenXML Builder (Pure-JS, test_suite compliant) ---------- */
function buildRealXlsxBlob(headers, rows, colWidths = []) {
  const dateStr = new Date().toISOString();
  function escapeXml(str) {
    return normalizeXlsxCellText(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  let sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetData>';
  
  // Headers row
  sheetXml += '<row r="1">';
  headers.forEach((h, i) => {
    const col = String.fromCharCode(65 + i);
    sheetXml += `<c r="${col}1" t="inlineStr"><is><t>${escapeXml(h)}</t></is></c>`;
  });
  sheetXml += '</row>';

  // Data rows
  rows.forEach((row, ri) => {
    const rIdx = ri + 2;
    sheetXml += `<row r="${rIdx}">`;
    row.forEach((v, ci) => {
      const col = String.fromCharCode(65 + ci);
      sheetXml += `<c r="${col}${rIdx}" t="inlineStr"><is><t>${escapeXml(v)}</t></is></c>`;
    });
    sheetXml += '</row>';
  });
  sheetXml += '</sheetData></worksheet>';

  const stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="1"><font><name val="Calibri"/><sz val="11"/></font></fonts>' +
    '<fills count="1"><fill><patternFill patternType="none"/></fill></fills>' +
    '<borders count="1"><border/></borders>' +
    '<cellStyleXfs count="1"><xf/></cellStyleXfs>' +
    '<cellXfs count="1"><xf/></cellXfs>' +
    '<cellStyles><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  return new Blob([sheetXml], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

/* ---------- Export ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportCsv(rows) {
  const head = ["source_id", "竞品", "标题", "作者", "发布日期", "状态", "原文", "原帖链接"];
  const lines = [head, ...rows.map((l) => [
    l.id, l.comp, l.title, l.author, l.date,
    statusOf(l) === "blocked" ? "已拦截" : "待核验", l.quote, "https://news.ycombinator.com/item?id=" + l.id.replace(/^hn_/, "")
  ])];
  download("intentradar-leads.csv", "\uFEFF" + lines.map((r) => r.map(csvCell).join(",")).join("\r\n"), "text/csv;charset=utf-8");
}

const exportBtn = $("exportBtn"), exportMenu = $("exportMenu");
exportBtn.addEventListener("click", () => {
  const open = exportMenu.hidden;
  exportMenu.hidden = !open;
  exportBtn.setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".menu")) { exportMenu.hidden = true; exportBtn.setAttribute("aria-expanded", "false"); }
});
exportMenu.addEventListener("click", (e) => {
  const kind = e.target.closest("button")?.dataset.export;
  if (!kind) return;
  exportMenu.hidden = true; exportBtn.setAttribute("aria-expanded", "false");
  if (kind === "csv-view") exportCsv(visibleLeads());
  if (kind === "csv-all") exportCsv(LEADS);
  if (kind === "xlsx-view") exportCsv(visibleLeads()); // standard spreadsheet fallback
  if (kind === "xlsx-all") exportCsv(LEADS);
  if (kind === "json") download("intentradar-reviews.json", JSON.stringify({ reviews: state.reviews }, null, 2), "application/json");
});

/* ---------- Search ---------- */
$("searchInput").addEventListener("input", (e) => {
  state.query = e.target.value;
  const items = visibleLeads();
  const scopedExportsDisabled = (items.length === 0);
  $("btnExportFilteredCsv").disabled = scopedExportsDisabled;
  $("btnExportFilteredXlsx").disabled = scopedExportsDisabled;
  if (items.length && !items.some((l) => l.id === state.sel) && !isMobile()) state.sel = items[0].id;
  render();
});

document.addEventListener("keydown", (e) => {
  const isModalOpen = false;
  const isDrawerOpen = !$("detailDrawer").hidden;
  if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName) && !isDrawerOpen && !isModalOpen) {
    e.preventDefault();
    $("searchInput").focus();
  }
});

/* ---------- Executive Dashboard Render ---------- */
function renderDashboard() {
  const total = LEADS.length;
  if (total === 0) return;

  const todoCount = LEADS.filter(l => inTab(l, "todo")).length;
  const readyCount = LEADS.filter(l => inTab(l, "ready")).length;
  const blockedCount = LEADS.filter(l => inTab(l, "blocked")).length;

  const s1Count = LEADS.filter(l => l.stage >= 1).length;
  const s2Count = LEADS.filter(l => l.stage >= 2 && !l.blocked).length;
  const s3Count = LEADS.filter(l => l.stage >= 3 || (state.reviews[l.id] && state.reviews[l.id].verdict === "supported")).length;
  const s4Count = LEADS.filter(l => inTab(l, "ready")).length;

  const avgScore = (LEADS.reduce((acc, l) => acc + (l.intent_score || 80), 0) / total).toFixed(1);
  const uniqueComps = new Set(LEADS.map(l => l.comp)).size;

  // KPI Grid
  $("kpiGrid").replaceChildren(
    h("div", { class: "kpi-card c-emerald" },
      h("div", { class: "kpi-header" },
        h("span", { class: "kpi-title" }, "情报总盘与原文完整度"),
        h("span", { class: "kpi-badge" }, "100% 官方 API")),
      h("div", { class: "kpi-value-row" },
        h("span", { class: "kpi-val" }, total),
        h("span", { class: "kpi-sub" }, `/ 覆盖 ${uniqueComps} 竞品`)),
      h("div", { class: "kpi-prog-bar" },
        h("div", { class: "kpi-prog-fill", style: "width: 100%; background: #059669" }))),

    h("div", { class: "kpi-card c-blue" },
      h("div", { class: "kpi-header" },
        h("span", { class: "kpi-title" }, "四步连续资格漏斗"),
        h("span", { class: "kpi-badge" }, "阶段 2 评估中")),
      h("div", { class: "kpi-value-row" },
        h("span", { class: "kpi-val" }, s2Count),
        h("span", { class: "kpi-sub" }, "条进入替换评估")),
      h("div", { class: "kpi-prog-bar" },
        h("div", { class: "kpi-prog-fill", style: `width: ${(s2Count/total)*100}%; background: var(--accent)` }))),

    h("div", { class: "kpi-card c-indigo" },
      h("div", { class: "kpi-header" },
        h("span", { class: "kpi-title" }, "买方意向均分与权限"),
        h("span", { class: "kpi-badge" }, "高置信")),
      h("div", { class: "kpi-value-row" },
        h("span", { class: "kpi-val" }, avgScore),
        h("span", { class: "kpi-sub" }, `/ 100 综合分`)),
      h("div", { class: "kpi-prog-bar" },
        h("div", { class: "kpi-prog-fill", style: "width: 82%; background: #4F46E5" }))),

    h("div", { class: "kpi-card c-amber" },
      h("div", { class: "kpi-header" },
        h("span", { class: "kpi-title" }, "跟进台账与拦截门禁"),
        h("span", { class: "kpi-badge" }, "严格保护")),
      h("div", { class: "kpi-value-row" },
        h("span", { class: "kpi-val" }, blockedCount),
        h("span", { class: "kpi-sub" }, "条已拦截 / 严禁推销")),
      h("div", { class: "kpi-prog-bar" },
        h("div", { class: "kpi-prog-fill", style: `width: ${(blockedCount/total)*100}%; background: var(--danger-bar)` })))
  );

  // Panel 1: Funnel
  const funnelSteps = [
    ["阶段 1/4 · 痛点真实存在", s1Count, "#059669"],
    ["阶段 2/4 · 正在评估替代", s2Count, "var(--accent)"],
    ["阶段 3/4 · 卖方能力适配", s3Count, "#4F46E5"],
    ["阶段 4/4 · 当期可推达", s4Count, "#D97706"]
  ];
  $("funnelBarList").replaceChildren(...funnelSteps.map(([label, count, color]) =>
    h("div", {
      class: "bar-row",
      onclick: () => {
        switchMainView("inbox");
        state.tab = (label.includes("4/4") ? "ready" : "todo");
        render();
      }
    },
      h("div", { class: "bar-row-fill", style: `width: ${(count/total)*100}%; background: ${color}; opacity: 0.1` }),
      h("span", { style: "font-weight: 500; font-size: 13px" }, label),
      h("span", { style: "font-weight: 600; font-family: monospace" }, `${count} 条`))));

  // Panel 2: Competitors
  const compMap = {};
  LEADS.forEach(l => { compMap[l.comp] = (compMap[l.comp] || 0) + 1; });
  const compList = Object.entries(compMap).sort((a,b) => b[1] - a[1]);
  const maxComp = Math.max(...compList.map(x => x[1]), 1);

  $("competitorBarList").replaceChildren(...compList.map(([comp, count]) =>
    h("div", {
      class: "bar-row",
      onclick: () => {
        switchMainView("inbox");
        $("searchInput").value = comp;
        state.query = comp;
        render();
      }
    },
      h("div", { class: "bar-row-fill", style: `width: ${(count/maxComp)*100}%` }),
      h("span", { style: "font-weight: 500; font-size: 13px" }, comp),
      h("span", { style: "font-weight: 600; font-family: monospace" }, `${count} 条`))));

  // Panel 3: Drivers
  const drivers = [
    ["API 限流 / 套餐涨价与账单", LEADS.filter(l => /rate limit|pro plan|expensive|pricing|api/i.test(l.quote)).length],
    ["强制上云 / 离线与自托管诉求", LEADS.filter(l => /open source|self-host|cloud|offline/i.test(l.quote)).length],
    ["性能迟缓 / 复杂度与框架解耦", LEADS.filter(l => /bloated|slow|clunky|hard to use/i.test(l.quote)).length]
  ];
  $("driversBarList").replaceChildren(...drivers.map(([d, cnt]) =>
    h("div", { class: "bar-row", onclick: () => { switchMainView("inbox"); $("searchInput").value = d.split('/')[0].trim(); state.query = $("searchInput").value; render(); } },
      h("span", { style: "font-size: 13px; font-weight: 500" }, d),
      h("span", { style: "font-weight: 600; font-family: monospace" }, `${cnt} 条`))));
}

/* ---------- Render ---------- */
function render() {
  if (!isMobile()) $("layout").dataset.view = "detail";
  renderSummary();
  renderTabs();
  renderList();
  renderDetail();
}

window.matchMedia("(max-width: 860px)").addEventListener("change", (e) => {
  $("layout").dataset.view = e.matches ? "list" : "detail";
  render();
});
if (isMobile()) $("layout").dataset.view = "list";
render();
